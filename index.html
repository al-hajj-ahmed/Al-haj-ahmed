.hero .wrap{grid-template-columns:minmax(0,1fr)!important}.hero .wrap>*{min-width:0;max-width:100%}.hero p{max-width:min(46ch,100%)}
.hero .art{width:min(100%,460px);gap:3%}.hero .art .fb{flex:none}.hero .art .f1{width:27.6%}.hero .art .f2{width:32.4%}.hero .art .f3{width:30.0%}
.hero .wrap{position:relative;z-index:1}
.hlogo{display:block;width:96px;height:96px;margin:0 auto 14px;border-radius:50%;box-shadow:0 0 0 1px #c9a24b88,0 0 30px #c9a24b44;animation:pop .8s both}
.is-home header .logo img{display:none}
#menu .mf{flex-wrap:wrap}
.row.soc{justify-content:center}
.ib.lb{flex-direction:column;display:flex;align-items:center;justify-content:center;gap:2px;width:auto;min-width:48px;padding:0 4px;height:50px;line-height:1}
.ib.lb .t{font:500 .62rem/1 'IBM Plex Sans Arabic',Tahoma,sans-serif;color:var(--mut);white-space:nowrap}
.ib.lb:hover .t{color:var(--gs)}
.ib.lb svg{width:22px;height:22px}#mo.lb .bot{width:26px;height:26px}
.fb{position:relative}.fb img{position:relative;z-index:1}
.fb .stm{position:absolute;left:44.5%;top:25%;width:11%;aspect-ratio:1;border-radius:50%;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(255,252,240,.9) 0,rgba(255,252,240,.5) 34%,rgba(255,252,240,0) 70%);animation:stA 6s linear infinite;animation-delay:calc(var(--i)*-.43s);will-change:transform,opacity}
.fb .stm.b{animation-name:stB}
@keyframes stA{0%{transform:translate(0,0) scale(.45);opacity:0}10%{opacity:.85}25%{transform:translate(-45%,-80%) scale(.8)}50%{transform:translate(55%,-170%) scale(1.25);opacity:.6}75%{transform:translate(-50%,-250%) scale(1.7);opacity:.3}100%{transform:translate(15%,-320%) scale(2.2);opacity:0}}
@keyframes stB{0%{transform:translate(0,0) scale(.45);opacity:0}10%{opacity:.85}25%{transform:translate(45%,-80%) scale(.8)}50%{transform:translate(-55%,-170%) scale(1.25);opacity:.6}75%{transform:translate(50%,-250%) scale(1.7);opacity:.3}100%{transform:translate(-15%,-320%) scale(2.2);opacity:0}}
.ib.lb .cnt{top:0;inset-inline-start:8px}.cnt[hidden]{display:none}
.hero .art{gap:2.5%;margin-top:34px}.hero .art .f1{width:28%}.hero .art .f2{width:38%}.hero .art .f3{width:29%}
/* ===== zoom lock ===== */
html,body{touch-action:pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%;max-width:100%}
#menu,#so,#msgs,#chat{touch-action:pan-y}
/* ===== footer ===== */
footer{position:relative;margin-top:48px;color:#cdbf9f;font-size:.9rem;overflow:hidden;border-top:1px solid var(--line);background:radial-gradient(520px 240px at 50% 0,#C9A24B22,transparent 70%),linear-gradient(180deg,#0b0b0b,#050505)}
footer::before{content:"";position:absolute;top:-1px;left:0;height:2px;width:35%;pointer-events:none;background:linear-gradient(90deg,transparent,var(--gs),transparent);animation:ftsw 7s ease-in-out infinite}
@keyframes ftsw{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
#ft{display:flex;flex-direction:column;gap:26px;padding:42px 16px calc(100px + env(safe-area-inset-bottom,0px))}
.ft-s.rv{transition-delay:calc(var(--i,0)*90ms)}
.ft-s h3{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:.85rem;color:var(--gs)}
.ft-s h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.ft-top{display:flex;flex-direction:column;align-items:center;text-align:center}
.ft-top h3{display:block;font-size:1.2rem;margin:12px 0 2px}.ft-top h3::after{display:none}
.ft-top p{margin:0 0 16px;color:var(--mut)}
.ft-logo{position:relative;width:84px;height:84px;display:block}
.ft-logo img{position:relative;z-index:1;width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 0 0 1px #c9a24b88}
.ft-logo::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid var(--gold);opacity:0;animation:ftr 4s ease-out infinite}
@keyframes ftr{0%{transform:scale(.95);opacity:.65}100%{transform:scale(1.3);opacity:0}}
.ft-soc{display:flex;gap:10px;justify-content:center}
.ft-soc a{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:#0e0c07;color:var(--gs);transition:transform .3s,background .3s,border-color .3s,color .3s}
.ft-soc a:hover,.ft-soc a:active{transform:translateY(-3px);background:var(--gold);border-color:var(--gold);color:#050505}
.ft-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 16px;padding-top:24px;border-top:1px solid var(--line)}
.ft-cols>div:first-child{grid-column:1/-1}
.ft-chips{display:flex;flex-wrap:wrap;gap:8px}
.ft-chips a{padding:5px 14px;border:1px solid var(--line);border-radius:20px;background:#0e0c07;font-size:.85rem;transition:transform .3s,border-color .3s,color .3s}
.ft-chips a:hover,.ft-chips a:active{transform:translateY(-2px);border-color:var(--gold);color:var(--gs)}
.ft-ls a{display:block;padding:6px 0;transition:transform .25s,color .25s}
.ft-ls a:hover,.ft-ls a:active{color:var(--gs);transform:translateX(-5px)}
.ft-ct{padding:18px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(160deg,#14110a,#0b0b0b)}
.ft-btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}.ft-btns .btn{flex:1 1 140px}
.ft-b{display:flex;gap:10px;align-items:flex-start;padding:12px 0 0;margin-top:12px;border-top:1px solid var(--line);transition:color .25s}
.ft-b:hover{color:var(--gs)}
.ft-b svg{flex:none;width:18px;height:18px;margin-top:5px;fill:none;stroke:var(--gold);stroke-width:1.6}
.ft-b b{display:block;color:var(--ink);font-weight:600;line-height:1.5}.ft-b small{display:block;color:var(--mut);font-size:.8rem;line-height:1.6}
.ft-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:18px;border-top:1px solid var(--line);color:var(--mut);font-size:.8rem}
.ft-up{width:40px;height:40px;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--gs);cursor:pointer;display:grid;place-items:center;transition:transform .3s,background .3s}
.ft-up:hover{background:#c9a24b22;transform:translateY(-3px)}.ft-up svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}
@media(min-width:900px){#ft{display:grid;grid-template-columns:1fr 1.7fr 1.2fr;gap:36px;align-items:start;padding-bottom:60px}.ft-top{align-items:flex-start;text-align:start}.ft-soc{justify-content:flex-start}.ft-cols{border:0;padding-top:0}.ft-bar{grid-column:1/-1}}
.hero .art{width:min(100%,500px);gap:2%}.hero .art .fb.f1{width:22%}.hero .art .fb.f2{width:54%}.hero .art .fb.f3{width:14%}
</style>

$('#si').oninput=e=>{const q=e.target.value;$('#sr').innerHTML=q.trim()?grid(find(q)).replace(/^<div class="grid">|<\/div>$/g,''):''};
$('#sr').onclick=e=>{if(e.target.closest('a'))$('#so').classList.remove('on')};
/* ===== ASSISTANT (local demo; production: POST /api/assistant) ===== */
$('#an').textContent=CONFIG.ASSISTANT_NAME;
const say=(h,c)=>{const m=document.createElement('div');m.className='m '+c;m.innerHTML=h;$('#msgs').append(m);$('#msgs').scrollTop=1e5};
const pc=l=>l.slice(0,3).map(p=>`<div class="mc">${img(p)}<div><b>${p.name}</b><div class="pr">${money(p.price)}</div><a class="btn sm" href="#/product/${p.slug}" style="min-height:34px">عرض المنتج</a> <button class="btn o sm" data-ap="${p.id}" style="min-height:34px">أضف</button></div></div>`).join('');
function ask(t){say(esc(t),'u');const q=norm(t),pn=(t.match(/\d+/)||[])[0];let r;
if(/فرع|فروع|وين|اين|عنوان/.test(q)&&!/عطر|منتج/.test(q))r='📍 '+CONFIG.BRANCHES.map(b=>b.name+'\n<a href="'+mapUrl(b)+'" target="_blank" rel="noopener"><u>'+b.addr+'</u></a>').join('\n\n📍 ');
else if(/كيف.*اطلب|الطلب|اطلب/.test(q)&&!pn)r='1. اختر المنتجات.\n2. أضفها إلى السلة.\n3. أدخل بياناتك.\n4. اضغط «تأكيد الطلب».\n5. سيتم استلام الطلب والتواصل معك لتأكيد التفاصيل.';
else if(/عروض|خصم/.test(q))r='تجد العروض هنا: <a href="#/offers"><u>صفحة العروض</u></a>';
else if(/استرجاع|استبدال/.test(q))r='تجد التفاصيل هنا: <a href="#/returns"><u>الاستبدال والاسترجاع</u></a>';
else if(/تواصل|هاتف|واتساب|رقم/.test(q))r='الهاتف: '+CONFIG.STORE_PHONE+'\nواتساب: '+CONFIG.WHATSAPP_DISPLAY+'\n<a href="#/contact"><u>صفحة التواصل</u></a>';
else if(/توصيل|شحن/.test(q))r='يتم تأكيد تكلفة التوصيل مع العميل بعد إرسال الطلب.';
else{let l=[];const kw=q.split(/\s+/).filter(w=>w.length>2&&!/اريد|عايز|ابحث|عن|ساعدني|في|حدود|جنيه/.test(w));kw.forEach(w=>find(w).forEach(p=>!l.includes(p)&&l.push(p)));
if(/عطر/.test(q)&&!l.length)l=PRODUCTS.filter(p=>p.cat==='perfumes');if(/بخور|سودان/.test(q))l=PRODUCTS.filter(p=>p.cat==='bakhoor');if(/تركيب/.test(q))l=PRODUCTS.filter(p=>p.cat==='blends');
if(pn)l=l.filter(p=>p.price<=+pn);
if(l.length)r='يسعدني ترشيح هذه المنتجات من الكتالوج الحالي:'+pc(l);
else if(/هدي/.test(q))r='يسعدني مساعدتك. هل تفضل عطرًا نسائيًا، أم منتجًا من منتجات العناية والجمال؟';
else if(/عطر|اختيار|ساعد/.test(q))r='بكل سرور. هل تفضل رائحة شرقية دافئة، أم رائحة أكثر هدوءًا وانتعاشًا؟';
else r='لا أملك هذه المعلومة حاليًا، ويمكنك التواصل مع فريق حاج أحمد للتأكد منها.'}
setTimeout(()=>say(r,'b'),450)}
$('#chips').innerHTML=['ساعدني في اختيار عطر','ما أنواع البخور؟','أين فروعكم؟','كيف أطلب؟','أريد هدية'].map(c=>`<button type="button">${c}</button>`).join('');
$('#chips').onclick=e=>{if(e.target.tagName==='BUTTON')ask(e.target.textContent)};
$('#cf').onsubmit=e=>{e.preventDefault();const v=$('#ci').value.trim();if(v){$('#ci').value='';ask(v)}};
$('#ai').onclick=()=>{$('#chat').classList.toggle('on');if(!$('#msgs').children.length)say('مرحبًا بك في '+CONFIG.STORE_NAME+'. أنا '+CONFIG.ASSISTANT_NAME+'، يسعدني مساعدتك في اختيار ما يناسبك.','b')};$('#cx').onclick=()=>$('#chat').classList.remove('on');
document.querySelectorAll('[data-logo]').forEach(i=>i.src=IMG.logo);{const l=document.createElement('link');l.rel='icon';l.href=IMG.logo;document.head.append(l)}
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
render();
</script>
</body>
</html>
